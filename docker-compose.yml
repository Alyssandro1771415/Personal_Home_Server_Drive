services:
  postgres:
    image: postgres:16
    container_name: personal-drive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: suasenha
      POSTGRES_DB: personal_drive
    ports:
      # 5432 na máquina já está com outro Postgres; este drive usa 5433.
      - "5433:5432"
    volumes:
      - personal_drive_pg:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_drive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_drive_pg:
