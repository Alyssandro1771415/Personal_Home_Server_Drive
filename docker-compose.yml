services:
  postgres:
    image: postgres:16
    container_name: personal-drive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suasenha}
      POSTGRES_DB: ${POSTGRES_DB:-personal_drive}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 5432 na máquina pode estar ocupada; expõe apenas em localhost por segurança.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_drive}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    container_name: personal-drive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      STORAGE_ROOT: /data/storage
      TRASH_TTL_DAYS: ${TRASH_TTL_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-personal_drive}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-suasenha}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    volumes:
      # Pastas e arquivos reais ficam salvos diretamente aqui no disco do servidor
      - ${DATA_DIR:-./data}/storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./Front-End
      dockerfile: Dockerfile
    container_name: personal-drive-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16
    container_name: personal-drive-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-personal_drive}
      PGPASSWORD: ${POSTGRES_PASSWORD:-suasenha}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${DATA_DIR:-./data}/backups:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup.sh"]
